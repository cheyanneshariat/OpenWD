name: J1637 Fe II reference audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: j1637-reference-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  OPENWD_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Require C acceleration
        run: python -c "from wd_spectra import _rt; assert hasattr(_rt, 'stark_manifold_bins')"
      - name: Recover old controls, then capture current Fe defaults
        run: >-
          python research/guard_d6_capture.py --rss-gib 6 --seconds 13800
          --output results/capture-monitor -- python -u tools/build_d6_regression.py
          tests/data/d6_regressions/warm_v1 results/warm_v2_feii
          --from-frozen-reference --verify-legacy-uv-controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j1637-feii-reference-proof
          path: results
          retention-days: 14
