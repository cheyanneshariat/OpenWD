[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openwd"
version = "0.1.4"
description = "Open-source white-dwarf atmosphere and spectrum calculations"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Kareem El-Badry"}]
dependencies = ["numpy>=1.23", "matplotlib>=3.6", "scipy>=1.10", "mpmath>=1.2", "numba>=0.58"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
test = ["pytest>=7"]
validation = ["astropy>=5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wd_spectra = ["data/**/*"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not canary'"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "canary: slow end-to-end atmosphere and spectrum regressions",
  "spectral: fixed-atmosphere spectrum regressions, not cold-start qualification",
]
